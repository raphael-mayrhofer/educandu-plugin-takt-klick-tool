name: Check plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn gulp lint
      - run: yarn gulp test
      - run: yarn gulp build
      - run: yarn gulp buildTestApp
      - run: git diff --exit-code -- src/translations.json
